name: Build ZMK firmware
on:
  push:
    branches:
      - feat/latex-layer-display-20261120
  workflow_dispatch:

concurrency:
  group: zmk-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-obsolete:
    name: Cancel previous LaTeX branch runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel obsolete queued and active workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "feat/latex-layer-display-20261120" ]]; then exit 0; fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id' | while read -r run_id; do
              if [[ "$run_id" != "$GITHUB_RUN_ID" ]]; then
                if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
                  echo "Cancellation requested for obsolete run $run_id"
                else
                  echo "Could not cancel $run_id (may already be finishing or token lacks permission)"
                fi
              fi
            done

  validate:
    name: Validate before firmware matrix
    needs: cancel-obsolete
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/keypress/latex_keymap_test.py
      - run: sh tests/keypress/run.sh
      - run: sh tests/split_repair/run.sh
      - run: sh tests/lilac/run.sh
      - run: sh tests/gradient/run.sh
      - run: sh tests/display/run_scene.sh
      - uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/lvgl
          ref: 8a6a2d1d29d17d1e4bdc94c243c146a39d635fdd
          path: .test-lvgl
      - uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/zephyr
          ref: dacab4875df72109b96cc8977547a0dc04875bcd
          path: .test-zephyr
          sparse-checkout: modules/lvgl/lvgl_display_mono.c
          sparse-checkout-cone-mode: false
      - name: Test actual display renderer with pinned LVGL
        run: |
          cmake -S tests/display -B /tmp/sofle-display-test -DLVGL_SOURCE="$PWD/.test-lvgl" -DZEPHYR_SOURCE="$PWD/.test-zephyr"
          cmake --build /tmp/sofle-display-test --target display_test -j2
          /tmp/sofle-display-test/display_test
          cmake --build /tmp/sofle-display-test --target orbit_test -j2
          /tmp/sofle-display-test/orbit_test
          cmake --build /tmp/sofle-display-test --target starfield_test -j2
          /tmp/sofle-display-test/starfield_test

  build:
    needs: validate
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
  sofle-delivery:
    name: Verify and package matched Sofle firmware
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Verify application-only UF2 images and package instructions
        run: |
          mkdir sofle-matched
          cp firmware/sofle_choc_pro_left_keypress.uf2 sofle-matched/
          cp firmware/sofle_choc_pro_bt_right.uf2 sofle-matched/
          python3 tests/keypress/verify_uf2.py sofle-matched/*.uf2
          cp docs/sofle-split-recovery.md sofle-matched/FLASHING.md
          cp docs/sofle-keypress-display.md sofle-matched/DISPLAY.md
          printf '%s\n' "$GITHUB_SHA" > sofle-matched/SOURCE_COMMIT.txt
          cd sofle-matched
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-matched-firmware
          path: sofle-matched
      - name: Package daily-use lilac pair without repair code
        run: |
          mkdir sofle-lilac
          cp firmware/sofle_choc_pro_left_display_lilac.uf2 sofle-lilac/
          cp firmware/sofle_choc_pro_right_lilac.uf2 sofle-lilac/
          python3 tests/keypress/verify_uf2.py sofle-lilac/*.uf2
          cp docs/sofle-lilac-pair.md sofle-lilac/READ-ME-FIRST.md
          printf '%s\n' "$GITHUB_SHA" > sofle-lilac/SOURCE_COMMIT.txt
          cd sofle-lilac
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-lilac-matched
          path: sofle-lilac
      - name: Package static gradient and right-screen animation pair
        run: |
          mkdir sofle-gradient
          cp firmware/sofle_choc_pro_left_gradient.uf2 sofle-gradient/
          cp firmware/sofle_choc_pro_right_gradient_orbit.uf2 sofle-gradient/
          python3 tests/keypress/verify_uf2.py sofle-gradient/*.uf2
          cp docs/sofle-gradient-orbit.md sofle-gradient/READ-ME-FIRST.md
          printf '%s\n' "$GITHUB_SHA" > sofle-gradient/SOURCE_COMMIT.txt
          cd sofle-gradient
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-gradient-orbit-matched
          path: sofle-gradient
      - name: Package read-only right diagnostics separately
        run: |
          mkdir sofle-diagnostics
          cp firmware/sofle_choc_pro_right_diagnostics.uf2 sofle-diagnostics/
          python3 tests/keypress/verify_uf2.py sofle-diagnostics/*.uf2
          cp docs/sofle-split-diagnostics.md sofle-diagnostics/READ-ME.md
          printf '%s\n' "$GITHUB_SHA" > sofle-diagnostics/SOURCE_COMMIT.txt
          cd sofle-diagnostics
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-right-diagnostics
          path: sofle-diagnostics
      - name: Package explicit one-time split repair separately
        run: |
          mkdir sofle-split-repair
          cp firmware/sofle_choc_pro_left_split_repair.uf2 sofle-split-repair/
          cp firmware/sofle_choc_pro_right_split_repair.uf2 sofle-split-repair/
          python3 tests/keypress/verify_uf2.py sofle-split-repair/*.uf2
          cp docs/sofle-split-bond-repair.md sofle-split-repair/READ-ME-FIRST.md
          printf '%s\n' "$GITHUB_SHA" > sofle-split-repair/SOURCE_COMMIT.txt
          cd sofle-split-repair
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-split-bond-repair
          path: sofle-split-repair

      - name: Package full-board gradient and detailed starfield pair
        run: |
          mkdir sofle-starfield
          cp firmware/sofle_choc_pro_left_blue_lilac.uf2 sofle-starfield/
          cp firmware/sofle_choc_pro_right_blue_lilac_starfield.uf2 sofle-starfield/
          python3 tests/keypress/verify_uf2.py sofle-starfield/*.uf2
          cp docs/sofle-full-gradient-starfield.md sofle-starfield/READ-ME-FIRST.md
          printf '%s\n' "$GITHUB_SHA" > sofle-starfield/SOURCE_COMMIT.txt
          cd sofle-starfield
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-blue-lilac-starfield-matched
          path: sofle-starfield
