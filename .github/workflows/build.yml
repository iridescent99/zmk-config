name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  sofle-delivery:
    name: Verify and package Sofle left firmware
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Verify application-only UF2 images and package instructions
        run: |
          mkdir sofle-left
          cp firmware/sofle_choc_pro_left_keypress.uf2 sofle-left/
          cp firmware/sofle_choc_pro_bt_left.uf2 sofle-left/
          python3 tests/keypress/verify_uf2.py sofle-left/*.uf2
          cp docs/sofle-keypress-display.md sofle-left/FLASHING.md
          printf '%s\n' "$GITHUB_SHA" > sofle-left/SOURCE_COMMIT.txt
          cd sofle-left
          sha256sum *.uf2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-left-firmware
          path: sofle-left
