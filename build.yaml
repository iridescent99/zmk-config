# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_bt_left
  - board: corne_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_right

  - board: corne_choc_pro_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_bt_5col_left
  - board: corne_choc_pro_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_5col_right

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: piantor_pro_bt_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_left
  - board: piantor_pro_bt_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_right

  - board: piantor_pro_bt_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_5col_left
  - board: piantor_pro_bt_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_5col_right

  - board: piantor_pro_bt_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: piantor_pro_bt_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_choc_pro_bt_left
  - board: sofle_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: sofle_choc_pro_bt_right

  - board: sofle_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: sofle_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # Optional left-only typing trainer. The original Sofle artifacts above remain
  # available for rollback. Deliver with sofle_choc_pro_bt_right from this run
  # so both halves use the same ZMK revision; right artwork remains unchanged.
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SOFLE_KEYPRESS_DISPLAY=y
    artifact-name: sofle_choc_pro_left_keypress

  # Daily-use matched pair: key display + solid lilac; no repair/diagnostics.
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SOFLE_KEYPRESS_DISPLAY=y -DCONFIG_SOFLE_LILAC_LIGHTING=y
    artifact-name: sofle_choc_pro_left_display_lilac
  - board: sofle_choc_pro_right
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_SOFLE_LILAC_LIGHTING=y
    artifact-name: sofle_choc_pro_right_lilac

  # Static lilac-to-pink gradient on both halves; animation on right LCD only.
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip sofle_gradient
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SOFLE_KEYPRESS_DISPLAY=y -DCONFIG_SOFLE_LILAC_LIGHTING=y
    artifact-name: sofle_choc_pro_left_gradient
  - board: sofle_choc_pro_right
    snippet: studio-rpc-usb-uart
    shield: sharp_mip sofle_gradient
    cmake-args: -DCONFIG_SOFLE_LILAC_LIGHTING=y -DCONFIG_SOFLE_RIGHT_ANIMATION=y
    artifact-name: sofle_choc_pro_right_gradient_orbit

  # Temporary observation-only right build: preserves bonds and normal transport.
  - board: sofle_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_SOFLE_SPLIT_DIAGNOSTICS=y
    artifact-name: sofle_choc_pro_right_diagnostics

  # Explicit one-time split-bond recovery. Never included in the normal package.
  - board: sofle_choc_pro_left
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SOFLE_KEYPRESS_DISPLAY=y -DCONFIG_SOFLE_SPLIT_REPAIR=y
    artifact-name: sofle_choc_pro_left_split_repair
  - board: sofle_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_SOFLE_SPLIT_DIAGNOSTICS=y -DCONFIG_SOFLE_SPLIT_REPAIR=y
    artifact-name: sofle_choc_pro_right_split_repair

  # Physical full-board palette and detailed right starfield, same source commit.
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip sofle_gradient
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SOFLE_KEYPRESS_DISPLAY=y -DCONFIG_SOFLE_LILAC_LIGHTING=y -DCONFIG_SOFLE_PHYSICAL_GRADIENT=y
    artifact-name: sofle_choc_pro_left_blue_lilac
  - board: sofle_choc_pro_right
    snippet: studio-rpc-usb-uart
    shield: sharp_mip sofle_gradient
    cmake-args: -DCONFIG_SOFLE_LILAC_LIGHTING=y -DCONFIG_SOFLE_PHYSICAL_GRADIENT=y -DCONFIG_SOFLE_RIGHT_STARFIELD=y
    artifact-name: sofle_choc_pro_right_blue_lilac_starfield

  # Same daily-use visuals and LaTeX layout, with the single right encoder
  # emitting ordinary mouse-wheel events. Keep the existing pair for rollback.
  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip sofle_gradient sofle_scroll
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_SOFLE_KEYPRESS_DISPLAY=y -DCONFIG_SOFLE_LILAC_LIGHTING=y -DCONFIG_SOFLE_PHYSICAL_GRADIENT=y
    artifact-name: sofle_choc_pro_left_scroll
  - board: sofle_choc_pro_right
    snippet: studio-rpc-usb-uart
    shield: sharp_mip sofle_gradient sofle_scroll
    cmake-args: -DCONFIG_SOFLE_LILAC_LIGHTING=y -DCONFIG_SOFLE_PHYSICAL_GRADIENT=y -DCONFIG_SOFLE_RIGHT_STARFIELD=y
    artifact-name: sofle_choc_pro_right_scroll
